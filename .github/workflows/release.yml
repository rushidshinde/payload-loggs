name: Release
run-name: "${{ inputs.commit_message || 'Release' }}"

on:
  workflow_dispatch:
    inputs:
      commit_message:
        type: string
        description: "Commit message (e.g. fix(pkg): ...)"
        required: false
      dry-run:
        type: boolean
        description: "Dry run (do not publish)"
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display release target commit
        run: |
          echo "Releasing HEAD commit:"
          git log -1 --format="Hash: %H%nSubject: %s%nAuthor: %an <%ae>%nDate: %cd"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Run semantic-release
        run: pnpm exec semantic-release ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
